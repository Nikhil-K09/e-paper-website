{% extends "layout.html" %}
{% block content %}
{% if pdf_file %}
<div class="pdf-container">
  <iframe id="pdf-frame" src="{{ url_for('get_full_pdf', file_id=pdf_file.file_id) }}" width="100%" height="600px"></iframe>
</div>
{% else %}
<p>No article available for this selection.</p>
{% endif %}
{% endblock %}
