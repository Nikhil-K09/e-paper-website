<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyE-Paper</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="title">MyE-Paper</div>
    <div class="controls">
      <input type="date" id="datePicker" value="{{ date }}">
      <select id="districtPicker">
        {% for d in districts %}
          <option value="{{ d.name }}" {% if d.name == district %}selected{% endif %}>{{ d.name }}</option>
        {% endfor %}
      </select>

      {% if session.admin %}
        <span>{{ session.admin_name }}</span>
        <a href="{{ url_for('logout') }}">Logout</a>
        <a href="{{ url_for('manage') }}">Manage</a>
      {% elif session.user_id %}
        <span>{{ session.username }}</span>
        <a href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
      {% endif %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
