<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyE-Paper</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header>
    <div class="title">MyE-Paper</div>
    <div class="controls">
      <input type="date" id="datePicker" value="{{ date }}">
      <input type="text" id="districtPicker" placeholder="District" value="{{ district }}">
      {% if user %}
        <span>{{ user.username }}</span>
        <a href="{{ url_for('logout') }}">Logout</a>
        {% if session.admin_id %}
          <a href="{{ url_for('manage') }}" class="manage-btn">Manage</a>
        {% endif %}
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
      {% endif %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
