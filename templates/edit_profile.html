{% extends "layout.html" %}
{% block content %}
<div class="auth-container">
  <div class="auth-box">
    <h2>Edit Profile</h2>
    <form method="POST" class="auth-form">
      <input type="text" name="username" value="{{ user.username }}" placeholder="Username" required>
      <input type="email" name="email" value="{{ user.email }}" placeholder="Email" required>
      <input type="text" name="phone" value="{{ user.phone }}" placeholder="Phone" required>

      <div class="password-wrapper">
        <input type="password" name="password" id="editPassword" placeholder="New Password (leave blank to keep)">
        <span class="toggle-password" onclick="togglePassword('editPassword', this)">👁</span>
      </div>

      <button type="submit" class="auth-btn">Update Profile</button>
    </form>
  </div>
</div>
{% endblock %}
